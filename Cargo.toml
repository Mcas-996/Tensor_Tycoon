[package]
name = "tensor_tycoon"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "A bilingual, cross-platform terminal AI model strategy game"
readme = "README.md"
repository = "https://github.com/Mcas-996/Tensor_Tycoon"

[dependencies]
crossterm = "0.28"
directories = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
