[package]
name = "monopoly_cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Mcas-996/monopoly_cli"
description = "A bilingual, cross-platform terminal property trading game"
readme = "README.md"

[dependencies]
crossterm = "0.28"
directories = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
